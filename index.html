<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Quarto</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <div id="app">
    <div id="scene-container"></div>

    <button id="backButton">Voltar</button>

    <div id="inventory">Inventário</div>

    <div id="notesPanel">
      <h3>Minhas notas</h3>
      <textarea id="notesText" placeholder="Escreva suas anotações..."></textarea>
    </div>

    <div id="interactionBox">
      <h2 id="interactionTitle">Quarto</h2>
      <p id="interactionText">Clique em algum item do quarto.</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.167.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
